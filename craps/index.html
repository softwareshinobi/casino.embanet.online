    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --craps-felt: #343f56; /* Changed from green to match theme */

        html, body {

        body {

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;

            padding: 1.5rem;

            position: relative;
            display: flex;
            flex-direction: column;
            /* Add a top margin for consistent spacing below the fixed navbar */

        .playing-surface {
            background-color: var(--craps-felt);

        .place-bets-grid {

        .bet-area {

            padding: 0.5rem;
            text-align: center;
            font-size: 1.2rem;

            display: flex;
            flex-direction: column;
            justify-content: center;

        .bet-area:not(.disabled):hover {
            background-color: rgba(255, 255, 255, 0.1);

        .bet-area.point-on {
            border-color: var(--quartz-secondary);
            box-shadow: 0 0 12px var(--quartz-secondary), inset 0 0 8px rgba(24, 178, 178, 0.5);
            transform: scale(1.05);
        }

        .bet-area.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            /* Removed display: none; from here as it was causing some elements to disappear
               even when they just needed to be disabled. The original issue was likely not this line. */
        }

        .bet-area.pass-line {
        /* background-color: rgba(24, 178, 178, 0.3);*/

        .bet-area.dont-pass-line {
            /*background-color: rgba(220, 53, 69, 0.3);*/

        .line-bets-container {

        .bet-area.field-bet {
        /* background-color: rgba(108, 117, 125, 0.3);*/

        .bet-area .bet-amount {

        .actions-panel, .betting-panel, .info-panel {

        .action-button, .bet-button {

        /* Styles for the new "Keep Bets" button */
        .trash{
            border-radius: 0.375rem; /* Bootstrap's default button border-radius */
            border: 2px solid var(--quartz-light);

        #btnKeepBetsTRASH {
            background-color: transparent;
            color: var(--quartz-light);

        #btnKeepBets {

            width: 100%;

        #btnKee33pBets { /* This ID seems like a typo, consider removing if not used */
            border: 2px solid var(--quartz-light);
            background-color: transparent;
            color: var(--quartz-light);
            padding: 0.5rem 1rem;

        #btnKeepBets.active-toggle-button {
            background-color: green;

        #btnKeepBets:hover:not(.active-toggle-button) {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 1.5rem;
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }

        .info-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }
        .info-display span {
            color: var(--quartz-secondary);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .game-console {
                padding: 1rem;
                margin-top: 1rem; /* Keep consistent margin for mobile too */
            }
            .action-button { font-size: 1.2rem; }
            .bet-button { font-size: 0.8rem; }
            .info-display { font-size: 1rem; }
            .actions-panel, .betting-panel, .info-panel { padding: 0.75rem; }
            .bet-area { font-size: 1rem; padding: 0.25rem; }
            .die { /* Removed unused/commented out rules here */ }

            .place-bets-grid {
                 grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DOM Elements ---
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');
        const statusMessageEl = document.getElementById('statusMessage');
        const btnRoll = document.getElementById('btnRoll');
        const btnClearBets = document.getElementById('btnClearBets');
        const btnKeepBets = document.getElementById('btnKeepBets'); // New: Reference to the Keep Bets button
        const betButtons = document.querySelectorAll('.bet-value-button');
        const walletAmountEl = document.getElementById('walletAmount');
        const betAmountEl = document.getElementById('betAmount');
        const placeBetAreas = document.querySelectorAll('.bet-area[data-bet-type="place"]');
        const passLineBetArea = document.getElementById('passLineBetArea');
        const dontPassLineBetArea = document.getElementById('dontPassLineBetArea');
        const fieldBetArea = document.getElementById('fieldBetArea');

        // --- Game State ---
        let wallet = 10000;
        let currentBet = 100;
        let passLineBet = 0;
        let dontPassBet = 0;
        let fieldBet = 0;
        let placeBets = { 4: 0, 5: 0, 6: 0, 8: 0, 9: 0, 10: 0 };
        let point = 0; // 0 means point is OFF
        let canRoll = false;
        let keepWinningBets = true; // true by default

        // --- Game Functions ---
        function showStatusMessage(message, duration = 1000) {
            statusMessageEl.innerHTML = message;
            statusMessageEl.style.display = 'block';
            setTimeout(() => statusMessageEl.style.display = 'none', duration);
        }

        function updateButtonState(state) {
            // States: 'betting', 'readyToRoll', 'inProgress'
            canRoll = state === 'readyToRoll';
            btnRoll.disabled = !canRoll;

            let canClear = false;
            if (point === 0) {
                if (passLineBet > 0 || dontPassBet > 0 || fieldBet > 0) {
                    canClear = true;
                }
            } else {
                const hasPlaceBets = Object.values(placeBets).some(bet => bet > 0);
                if (fieldBet > 0 || hasPlaceBets) {
                    canClear = true;
                }
            }
            btnClearBets.disabled = !canClear;
        }

        function updateActiveBetButton(selectedBet) {
             betButtons.forEach(btn => {
                if(btn.dataset.bet === 'max' && selectedBet === wallet) btn.classList.add('active');
                else if (parseInt(btn.dataset.bet) === selectedBet) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }

        function updatePointIndicator() {
            // Update Place Bets areas
            placeBetAreas.forEach(area => {
                const number = area.dataset.number;
                area.classList.remove('point-on', 'disabled');

                if (point === 0) {
                    // Only disable if there's no active bet on them (meaning they can be clicked to place)
                    // We need to ensure that bets currently on the table for place numbers remain visible and active
                    if (placeBets[number] === 0) {
                         area.classList.add('disabled');
                    }
                } else {
                    if (point.toString() === number) {
                        area.classList.add('point-on');
                    }
                }
            });

            // Update Pass/Don't Pass Line areas
            if (point === 0) {
                // Point is OFF, so enable line bets
                passLineBetArea.classList.remove('disabled');
                dontPassLineBetArea.classList.remove('disabled');
            } else {
                // Point is ON, so disable line bets (they are resolved on 7-out or point hit)
                passLineBetArea.classList.add('disabled');
                dontPassLineBetArea.classList.add('disabled');
            }
        }


        function renderAllBets() {
            document.getElementById('passLineBetAmount').textContent = passLineBet > 0 ? `$${passLineBet}` : '';
            document.getElementById('dontPassBetAmount').textContent = dontPassBet > 0 ? `$${dontPassBet}` : '';
            document.getElementById('fieldBetAmount').textContent = fieldBet > 0 ? `$${fieldBet}` : '';
            for(const num in placeBets){
                document.getElementById(`placeBetAmount${num}`).textContent = placeBets[num] > 0 ? `$${placeBets[num]}` : '';
            }
        }

        function clearBoardForNewRound() {
            passLineBet = 0;
            dontPassBet = 0;
            fieldBet = 0;
            for(const num in placeBets) { placeBets[num] = 0; }
            point = 0;
            renderAllBets();
            updatePointIndicator();
            updateButtonState('betting');
            walletAmountEl.textContent = wallet;
            if(wallet <= 0) showStatusMessage("Game Over", 2000);
        }

        function clearActiveBets() {
            let returnedAmount = 0;

            // Bets that can always be cleared (Field, Place bets when point is on, line bets when point is off)
            returnedAmount += fieldBet;
            fieldBet = 0;

            for (const num in placeBets) {
                returnedAmount += placeBets[num];
                placeBets[num] = 0;
            }

            if (point === 0) { // Only clear line bets if point is OFF (come out roll phase)
                returnedAmount += passLineBet;
                returnedAmount += dontPassBet;
                passLineBet = 0;
                dontPassBet = 0;
            }

            if (returnedAmount > 0) {
                wallet += returnedAmount;
                walletAmountEl.textContent = wallet;
                renderAllBets();
                showStatusMessage(`Bets cleared: +$${returnedAmount}`);
                const hasBets = passLineBet > 0 || dontPassBet > 0 || fieldBet > 0 || Object.values(placeBets).some(b => b > 0);
                updateButtonState(hasBets ? 'readyToRoll' : 'betting');
            }
            updatePointIndicator(); // Re-evaluate disabled state for place bets
        }


        function handleRollResult(roll) {
            let messages = [];

            // --- Resolve one-roll field bet first ---
            if (fieldBet > 0) {
                const bet = fieldBet;
                let payout = 0;
                let isWin = false;

                if ([3, 4, 9, 10, 11].includes(roll)) {
                    payout = bet; // 1:1 payout
                    isWin = true;
                    messages.push(`Field bet wins <span style="color:#ffc107;">+$${payout}!</span>`);
                } else if ([2, 12].includes(roll)) {
                    payout = bet * 2; // 2:1 payout
                    isWin = true;
                    messages.push(`Field bet wins <span style="color:#ffc107;">+$${payout}</span> on ${roll}!`);
                }

                if (isWin) {
                    wallet += payout; // Add winnings to wallet
                    if (!keepWinningBets) {
                        wallet += bet; // Return original bet
                        fieldBet = 0;  // Remove bet from table
                    }
                } else {
                    messages.push(`Field bet loses.`);
                    fieldBet = 0; // Bet is always lost
                }
            }

            // --- POINT IS ON ---
            if (point !== 0) {
                // Resolve Place Bets
                if (placeBets[roll]) {
                    const bet = placeBets[roll];
                    let payout = 0;
                    if ([4, 10].includes(roll)) payout = Math.floor(bet * 9 / 5);
                    else if ([5, 9].includes(roll)) payout = Math.floor(bet * 7 / 5);
                    else if ([6, 8].includes(roll)) payout = Math.floor(bet * 7 / 6);

                    wallet += payout; // Add only the winnings
                    messages.push(`Place ${roll} wins <span style="color:#ffc107;">+$${payout}!</span>`);

                    if (!keepWinningBets) {
                        wallet += bet; // Return the original bet to the wallet
                        placeBets[roll] = 0; // Clear the bet from the table
                    }
                }

                if (roll === point) {
                    messages.push(`Point ${point} Hit! Pass Line Wins.`);
                    if(passLineBet > 0) wallet += passLineBet * 2;
                    if(dontPassBet > 0) messages.push("Don't Pass loses.");

                    // All place bets returned (not paid, just returned) when point hits
                    let returnedPlaceBets = 0;
                    for (const num in placeBets) {
                        returnedPlaceBets += placeBets[num];
                    }
                    if (returnedPlaceBets > 0) {
                        wallet += returnedPlaceBets;
                        messages.push(`Place bets returned: +$${returnedPlaceBets}`);
                    }
                    clearBoardForNewRound();

                } else if (roll === 7) {
                    messages.push(`Seven Out! Pass Line and Place Bets Lose.`);
                    if(dontPassBet > 0) {
                        wallet += dontPassBet * 2;
                        messages.push("Don't Pass Wins!");
                    }
                    clearBoardForNewRound();
                }
            }
            // --- COME-OUT ROLL ---
            else {
                if ([7, 11].includes(roll)) {
                    messages.push(`${roll}! Pass Line Wins!`);
                    if(passLineBet > 0) wallet += passLineBet * 2;
                    if(dontPassBet > 0) messages.push("Don't Pass loses.");
                    clearBoardForNewRound();
                } else if ([2, 3].includes(roll)) {
                    messages.push(`${roll}! Craps! Pass loses.`);
                    if(dontPassBet > 0) { wallet += dontPassBet * 2; messages.push("Don't Pass wins!"); }
                    clearBoardForNewRound();
                } else if (roll === 12) {
                    messages.push(`12! Pass loses. Don't Pass PUSH.`);
                    if(dontPassBet > 0) wallet += dontPassBet; // Push
                    clearBoardForNewRound();
                } else {
                    point = roll;
                    messages.push(`Point is now ${point}.`);
                    updatePointIndicator();
                }
            }

            showStatusMessage(messages.length > 0 ? messages.join('<br>') : `Rolled ${roll}.`);
            walletAmountEl.textContent = wallet;
            renderAllBets();

            const hasBets = passLineBet > 0 || dontPassBet > 0 || fieldBet > 0 || (point !== 0 && Object.values(placeBets).some(b => b > 0));
            if (point !== 0) updateButtonState('readyToRoll');
            else if (hasBets) updateButtonState('readyToRoll');
            else updateButtonState('betting');
        }

        function rollDice() {
            const hasBets = passLineBet > 0 || dontPassBet > 0 || fieldBet > 0 || (point !== 0 && Object.values(placeBets).some(b => b > 0));
            if (!hasBets) {
                showStatusMessage("Place a Line bet to start!");
                return;
            }


            // Scroll to the top of the page
            die1El.scrollIntoView({ behavior: 'smooth', block: 'center' });


            updateButtonState('inProgress');
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                die1El.textContent = Math.floor(Math.random() * 6) + 1;
                die2El.textContent = Math.floor(Math.random() * 6) + 1;
                rollCount++;
                if (rollCount > 10) {
                    clearInterval(rollInterval);
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    die1El.textContent = d1;
                    die2El.textContent = d2;
                    handleRollResult(d1 + d2);
                }
            }, 100);
        }
        function handleBetPlacement(area) {
            const type = area.dataset.betType;
            const number = parseInt(area.dataset.number); // For place bets

            if (currentBet <= 0 || wallet < currentBet) {
                showStatusMessage("Invalid Bet!");
                return;
            }

            if (type === 'pass') {
                if (point !== 0) { showStatusMessage("Pass Line bets only on Come-Out."); return; }
                if (dontPassBet > 0) { showStatusMessage("Cannot bet Pass and Don't Pass at the same time."); return; }
                passLineBet += currentBet;
            } else if (type === 'dontpass') {
                if (point !== 0) { showStatusMessage("Don't Pass bets only on Come-Out."); return; }
                if (passLineBet > 0) { showStatusMessage("Cannot bet Pass and Don't Pass at the same time."); return; }
                dontPassBet += currentBet;
            } else if (type === 'place') {
                if (point === 0) { showStatusMessage("Set Point before Place bets."); return; }
                placeBets[number] = (placeBets[number] || 0) + currentBet;
            } else if (type === 'field') {
                fieldBet += currentBet;
            }

            wallet -= currentBet;
            walletAmountEl.textContent = wallet;
            renderAllBets();
            updateButtonState('readyToRoll');
            updatePointIndicator(); // Crucial to re-evaluate disabled state after placing a bet
        }


        // --- Event Listeners ---
        // Changed to use event delegation on the betting mat for all bet areas
        const bettingLayoutElements = document.querySelectorAll('.bet-area');
        bettingLayoutElements.forEach(area => {
            area.addEventListener('click', () => {
                // Ensure the area is not disabled, except for place bets if point is OFF
                if (area.classList.contains('disabled') && area.dataset.betType !== 'place') {
                    // Allow clicking on place bets even if disabled, but the handleBetPlacement will block if point is off.
                    // This is to prevent confusion.
                    return;
                }
                handleBetPlacement(area);
            });
        });

        btnRoll.addEventListener('click', rollDice);
        btnClearBets.addEventListener('click', clearActiveBets);

        // New: Event listener for the Keep Bets button
        btnKeepBets.addEventListener('click', () => {
            keepWinningBets = !keepWinningBets; // Toggle the boolean
            btnKeepBets.classList.toggle('active-toggle-button', keepWinningBets); // Toggle the class
            showStatusMessage(keepWinningBets ? "Winning bets will stay up." : "Winning bets will be returned.", 1000);
        });

        betButtons.forEach(button => {
            button.addEventListener('click', () => {
                const betValue = button.dataset.bet;
                currentBet = (betValue === 'max') ? wallet : parseInt(betValue);
                if (currentBet > wallet) currentBet = wallet;
                betAmountEl.textContent = currentBet;
                updateActiveBetButton(currentBet);
            });
        });

        // --- Initial Game Setup ---
        window.onload = () => {
            updateButtonState('betting');
            updateActiveBetButton(currentBet);
            renderAllBets();
            updatePointIndicator(); // Initialize point indicators
            // Set initial state of the Keep Bets button
            btnKeepBets.classList.toggle('active-toggle-button', keepWinningBets);
        };
    </script>
</body>
</html>
