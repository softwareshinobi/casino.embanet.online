<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craps / Shinobi Casino</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --craps-felt: #343f56; /* Changed from green to match theme */
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on desktop */
        }

        body {
            /* Changed to a standard system font stack */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem; /* Padding for small screens */
            background-color: var(--bs-body-bg);
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .playing-surface {
            background-color: var(--craps-felt);
            border-radius: 15px;
            padding: 1rem;
            border: 3px solid #495057;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
        }

        .dice-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            min-height: 80px;
        }

        .die {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border: 2px solid #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #333;
        }

        /* --- MODIFIED: Betting Layout Structure --- */
        .betting-layout {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .place-bets-grid {
             display: grid;
             grid-template-columns: repeat(6, 1fr);
             gap: 0.5rem;
        }

        .bet-area {
            border: 2px solid var(--quartz-light);
            border-radius: 10px;
            padding: 0.5rem;
            text-align: center;
            /* Font family is now inherited from body */
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--quartz-light);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .bet-area:not(.disabled):hover {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .bet-area.point-on {
            border-color: var(--quartz-secondary);
            box-shadow: 0 0 12px var(--quartz-secondary), inset 0 0 8px rgba(24, 178, 178, 0.5);
            transform: scale(1.05);
        }

        .bet-area.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* --- MODIFIED: Removed grid-column spans --- */
        .bet-area.pass-line {
            background-color: rgba(24, 178, 178, 0.3);
        }

        .bet-area.dont-pass-line {
            background-color: rgba(220, 53, 69, 0.3);
        }

        .line-bets-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .bet-area.field-bet {
            background-color: rgba(108, 117, 125, 0.3);
        }

        .bet-area .bet-amount {
            display: block;
            font-size: 1rem;
            color: #ffc107;
            min-height: 20px;
            font-weight: normal;
        }

        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
        }
        .actions-panel{
             border-top: 3px solid var(--quartz-secondary);
        }
        .betting-panel, .info-panel {
            border-top: 2px solid #212529;
       }

        .action-button, .bet-button {
            /* Font family is now inherited from body */
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s ease-in-out;
            padding: 0.75rem 0;
            width: 100%;
        }

        .action-button { font-size: 1.5rem; }
        .bet-button { font-size: 1rem; }

        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 1.5rem;
            /* Font family is now inherited from body */
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }

        .info-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }
        .info-display span {
            color: var(--quartz-secondary);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            body { overflow: auto; align-items: flex-start; }
            .game-console { padding: 1rem; margin-top: 1rem; }
            .action-button { font-size: 1.2rem; }
            .bet-button { font-size: 0.8rem; }
            .info-display { font-size: 1rem; }
            .actions-panel, .betting-panel, .info-panel { padding: 0.75rem; }
            .bet-area { font-size: 1rem; padding: 0.25rem; }
            .die { width: 45px; height: 45px; font-size: 1.5rem; }

            /* --- ADDED: Responsive grid for place bets --- */
            .place-bets-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="game-console">
        <div id="statusMessage" class="status-message"></div>

        <div class="playing-surface">
            <div class="dice-area">
                <div id="die1" class="die">?</div>
                <div id="die2" class="die">?</div>
            </div>
            <div class="betting-layout">
                 <div class="place-bets-grid">
                     <div class="bet-area" data-bet-type="place" data-number="4">4 <span class="bet-amount" id="placeBetAmount4"></span></div>
                     <div class="bet-area" data-bet-type="place" data-number="5">5 <span class="bet-amount" id="placeBetAmount5"></span></div>
                     <div class="bet-area" data-bet-type="place" data-number="6">6 <span class="bet-amount" id="placeBetAmount6"></span></div>
                     <div class="bet-area" data-bet-type="place" data-number="8">8 <span class="bet-amount" id="placeBetAmount8"></span></div>
                     <div class="bet-area" data-bet-type="place" data-number="9">9 <span class="bet-amount" id="placeBetAmount9"></span></div>
                     <div class="bet-area" data-bet-type="place" data-number="10">10 <span class="bet-amount" id="placeBetAmount10"></span></div>
                 </div>

                <div id="fieldBetArea" class="bet-area field-bet" data-bet-type="field">
                    FIELD <small>(2,3,4,9,10,11,12)</small>
                    <span id="fieldBetAmount" class="bet-amount"></span>
                </div>

                <div class="line-bets-container">
                    <div id="passLineBetArea" class="bet-area pass-line" data-bet-type="pass">
                        PASS LINE
                        <span id="passLineBetAmount" class="bet-amount"></span>
                    </div>
                     <div id="dontPassLineBetArea" class="bet-area dont-pass-line" data-bet-type="dontpass">
                        DON'T PASS
                        <span id="dontPassBetAmount" class="bet-amount"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions-panel mt-3">
            <div class="row g-2 justify-content-center">
                <div class="col-8">
                    <button id="btnRoll" class="btn btn-secondary action-button">Roll</button>
                </div>
            </div>
        </div>

        <div class="betting-panel mt-3">
             <div class="row g-2">
                 <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="100">$100</button></div>
                 <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="1000">$1000</button></div>
                 <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="5000">$5000</button></div>
                 <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="max">MAX</button></div>
            </div>
             <div class="row g-2 mt-2">
                <div class="col-12">
                    <button id="btnClearBets" class="btn btn-danger w-100">Clear Bets</button>
                </div>
             </div>
        </div>

        <div class="info-panel mt-3">
            <div class="row">
                <div class="col-6 info-display">Bet: $<span id="betAmount">100</span></div>
                <div class="col-6 info-display">Wallet: $<span id="walletAmount">10000</span></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DOM Elements ---
        const die1El = document.getElementById('die1');
        const die2El = document.getElementById('die2');
        const statusMessageEl = document.getElementById('statusMessage');
        const btnRoll = document.getElementById('btnRoll');
        const btnClearBets = document.getElementById('btnClearBets');
        const betButtons = document.querySelectorAll('.bet-button');
        const walletAmountEl = document.getElementById('walletAmount');
        const betAmountEl = document.getElementById('betAmount');
        const placeBetAreas = document.querySelectorAll('.bet-area[data-bet-type="place"]');
        const passLineBetArea = document.getElementById('passLineBetArea');
        const dontPassLineBetArea = document.getElementById('dontPassLineBetArea');
        const fieldBetArea = document.getElementById('fieldBetArea');

        // --- Game State ---
        let wallet = 10000;
        let currentBet = 100;
        let passLineBet = 0;
        let dontPassBet = 0;
        let fieldBet = 0;
        let placeBets = { 4: 0, 5: 0, 6: 0, 8: 0, 9: 0, 10: 0 };
        let point = 0; // 0 means point is OFF
        let canRoll = false;

        // --- Game Functions ---
        function showStatusMessage(message, duration = 3000) {
            statusMessageEl.innerHTML = message;
            statusMessageEl.style.display = 'block';
            setTimeout(() => statusMessageEl.style.display = 'none', duration);
        }

        function updateButtonState(state) {
            // States: 'betting', 'readyToRoll', 'inProgress'
            canRoll = state === 'readyToRoll';
            btnRoll.disabled = !canRoll;

            // Enable/disable the "Clear Bets" button
            let canClear = false;
            if (point === 0) {
                // Before a point, can clear line and field bets
                if (passLineBet > 0 || dontPassBet > 0 || fieldBet > 0) {
                    canClear = true;
                }
            } else {
                // After a point, can only clear place and field bets
                const hasPlaceBets = Object.values(placeBets).some(bet => bet > 0);
                if (fieldBet > 0 || hasPlaceBets) {
                    canClear = true;
                }
            }
            btnClearBets.disabled = !canClear;
        }

        function updateActiveBetButton(selectedBet) {
             betButtons.forEach(btn => {
                 if(btn.dataset.bet === 'max' && selectedBet === wallet) btn.classList.add('active');
                 else if (parseInt(btn.dataset.bet) === selectedBet) btn.classList.add('active');
                 else btn.classList.remove('active');
             });
        }

        function updatePointIndicator() {
            placeBetAreas.forEach(area => {
                const number = area.dataset.number;
                // Always clear previous state
                area.classList.remove('point-on', 'disabled');

                if (point === 0) {
                    // If point is off, disable place bets
                    area.classList.add('disabled');
                } else {
                    // If point is on, highlight the correct number
                    if (point.toString() === number) {
                        area.classList.add('point-on');
                    }
                }
            });
        }


        function renderAllBets() {
            document.getElementById('passLineBetAmount').textContent = passLineBet > 0 ? `$${passLineBet}` : '';
            document.getElementById('dontPassBetAmount').textContent = dontPassBet > 0 ? `$${dontPassBet}` : '';
            document.getElementById('fieldBetAmount').textContent = fieldBet > 0 ? `$${fieldBet}` : '';
            for(const num in placeBets){
                document.getElementById(`placeBetAmount${num}`).textContent = placeBets[num] > 0 ? `$${placeBets[num]}` : '';
            }
        }

        function clearBoardForNewRound() {
            passLineBet = 0;
            dontPassBet = 0;
            for(const num in placeBets) { placeBets[num] = 0; }
            point = 0;
            renderAllBets();
            updatePointIndicator();
            updateButtonState('betting');
            walletAmountEl.textContent = wallet;
            if(wallet <= 0) showStatusMessage("Game Over", 5000);
        }

        function clearActiveBets() {
            let returnedAmount = 0;

            // Before a point is set (come-out roll), clear Pass, Don't Pass, and Field bets.
            if (point === 0) {
                returnedAmount = passLineBet + dontPassBet + fieldBet;
                passLineBet = 0;
                dontPassBet = 0;
                fieldBet = 0;
            }
            // After a point is set, only clear Place and Field bets.
            else {
                returnedAmount += fieldBet;
                fieldBet = 0;
                for (const num in placeBets) {
                    returnedAmount += placeBets[num];
                    placeBets[num] = 0;
                }
            }

            if (returnedAmount > 0) {
                wallet += returnedAmount;
                walletAmountEl.textContent = wallet;
                renderAllBets();
                showStatusMessage(`Bets cleared: +$${returnedAmount}`);
                // Re-evaluate button states. If all bets are cleared, disable rolling.
                if (passLineBet === 0 && dontPassBet === 0 && fieldBet === 0 && Object.values(placeBets).every(b => b === 0)) {
                    updateButtonState('betting');
                } else {
                    updateButtonState('readyToRoll');
                }
            }
        }

        function handleRollResult(roll) {
            let messages = [];

            // Resolve one-roll field bet first
            if (fieldBet > 0) {
                if ([3, 4, 9, 10, 11].includes(roll)) {
                    wallet += fieldBet * 2; // Payout 1:1
                    messages.push(`Field bet wins +$${fieldBet}!`);
                } else if ([2, 12].includes(roll)) {
                    wallet += fieldBet * 3; // Payout 2:1
                    messages.push(`Field bet wins +$${fieldBet*2} on ${roll}!`);
                } else {
                    messages.push(`Field bet loses.`);
                }
                fieldBet = 0; // Field bet is for one roll only
            }

            // --- POINT IS ON ---
            if (point !== 0) {
                // Check for winning place bets
                if(placeBets[roll]){
                    const bet = placeBets[roll];
                    let payout = 0;
                    if([4, 10].includes(roll)) payout = Math.floor(bet * 9 / 5);
                    else if([5, 9].includes(roll)) payout = Math.floor(bet * 7 / 5);
                    else if([6, 8].includes(roll)) payout = Math.floor(bet * 7 / 6);
                    wallet += bet + payout;
                    messages.push(`Place ${roll} wins +$${payout}!`);
                    placeBets[roll] = 0;
                }

                if (roll === point) {
                    messages.push(`Point ${point} Hit! Pass Wins.`);
                    if(passLineBet > 0) wallet += passLineBet * 2;
                    if(dontPassBet > 0) messages.push("Don't Pass loses.");

                    // Return remaining place bets to wallet before clearing
                    let returnedPlaceBets = 0;
                    for (const num in placeBets) {
                        returnedPlaceBets += placeBets[num];
                    }
                    if (returnedPlaceBets > 0) {
                        wallet += returnedPlaceBets;
                        messages.push(`Place bets returned: +$${returnedPlaceBets}`);
                    }
                    clearBoardForNewRound();

                } else if (roll === 7) {
                    messages.push(`Seven Out!`);
                    if(passLineBet > 0) messages.push("Pass Line loses.");
                    if(dontPassBet > 0) { wallet += dontPassBet * 2; messages.push("Don't Pass Wins!"); }
                    // On a seven-out, place bets are lost
                    clearBoardForNewRound();
                }
            }
            // --- COME-OUT ROLL ---
            else {
                if ([7, 11].includes(roll)) {
                    messages.push(`${roll}! Pass Line Wins!`);
                    if(passLineBet > 0) wallet += passLineBet * 2;
                    if(dontPassBet > 0) messages.push("Don't Pass loses.");
                    clearBoardForNewRound();
                } else if ([2, 3].includes(roll)) {
                    messages.push(`${roll}! Craps! Pass loses.`);
                    if(dontPassBet > 0) { wallet += dontPassBet * 2; messages.push("Don't Pass wins!"); }
                    clearBoardForNewRound();
                } else if (roll === 12) {
                    messages.push(`12! Pass loses. Don't Pass PUSH.`);
                    if(dontPassBet > 0) wallet += dontPassBet;
                    clearBoardForNewRound();
                } else {
                    point = roll;
                    messages.push(`Point is now ${point}.`);
                    updatePointIndicator();
                }
            }

            showStatusMessage(messages.length > 0 ? messages.join('<br>') : `Rolled ${roll}.`, 1000);
            walletAmountEl.textContent = wallet;
            renderAllBets();
            if(point !== 0) updateButtonState('readyToRoll');
            else updateButtonState('betting'); // After a come-out resolution, check button states
        }

        function rollDice() {
            if (!canRoll && passLineBet === 0 && dontPassBet === 0 && fieldBet === 0) {
                 showStatusMessage("Place a bet to roll!");
                 return;
            }
            updateButtonState('inProgress');
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                die1El.textContent = Math.floor(Math.random() * 6) + 1;
                die2El.textContent = Math.floor(Math.random() * 6) + 1;
                rollCount++;
                if (rollCount > 10) {
                    clearInterval(rollInterval);
                    const d1 = Math.floor(Math.random() * 6) + 1;
                    const d2 = Math.floor(Math.random() * 6) + 1;
                    die1El.textContent = d1;
                    die2El.textContent = d2;
                    handleRollResult(d1 + d2);
                }
            }, 100);
        }

        function handleBetPlacement(area) {
            const type = area.dataset.betType;
            if (currentBet <= 0 || wallet < currentBet) {
                showStatusMessage("Invalid Bet!");
                return;
            }

            if (type === 'pass' || type === 'dontpass') {
                if (point !== 0) { showStatusMessage("Line bets only on Come-Out."); return; }
                if(type === 'pass') passLineBet += currentBet;
                else dontPassBet += currentBet;
            } else if (type === 'place') {
                // This check is redundant due to the .disabled class, but good for safety
                if (point === 0) { showStatusMessage("Set Point before Place bets."); return; }
                const num = parseInt(area.dataset.number);
                placeBets[num] += currentBet;
            } else if (type === 'field') {
                 fieldBet += currentBet;
            }

            wallet -= currentBet;
            walletAmountEl.textContent = wallet;
            renderAllBets();
            updateButtonState('readyToRoll');
        }

        // --- Event Listeners ---
        placeBetAreas.forEach(area => area.addEventListener('click', () => handleBetPlacement(area)));
        passLineBetArea.addEventListener('click', () => handleBetPlacement(passLineBetArea));
        dontPassLineBetArea.addEventListener('click', () => handleBetPlacement(dontPassLineBetArea));
        fieldBetArea.addEventListener('click', () => handleBetPlacement(fieldBetArea));
        btnRoll.addEventListener('click', rollDice);
        btnClearBets.addEventListener('click', clearActiveBets);

        betButtons.forEach(button => {
            button.addEventListener('click', () => {
                const betValue = button.dataset.bet;
                currentBet = (betValue === 'max') ? wallet : parseInt(betValue);
                if (currentBet > wallet) currentBet = wallet;
                betAmountEl.textContent = currentBet;
                updateActiveBetButton(currentBet);
            });
        });

        // --- Initial Game Setup ---
        window.onload = () => {
            updateButtonState('betting');
            updateActiveBetButton(currentBet);
            renderAllBets();
            updatePointIndicator(); // Set initial disabled state for place bets
        };
    </script>
</body>
</html>
