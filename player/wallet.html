    <div class="wallet-container">
        <div id="statusMessage" class="status-message"></div>

        <h1>Wallet Configuration</h1>

        <div class="info-display mb-4">
            Current Balance: $<span id="walletAmount">0</span>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="walletInput" class="form-control" placeholder="Enter new balance" inputmode="numeric" pattern="[0-9]*" aria-label="New wallet balance">
            <button class="btn btn-secondary" type="button" id="btnSetWallet">Set Balance</button>
        </div>

        <p class="text-muted small">Your balance is saved in your browser's cookies.</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // --- Cookie Functions ---
    /**
     * Sets a browser cookie.
     * @param {string} name - The name of the cookie.
     * @param {string} value - The value to store.
     * @param {number} days - The number of days until the cookie expires.
     */
    function setCookie(name, value, days) {
        let expires = "";
        if (days) {
            let date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + (value || "") + expires + "; path=/";
    }

    /**
     * Gets the value of a browser cookie.
     * @param {string} name - The name of the cookie.
     * @returns {string|null} The cookie's value, or null if not found.
     */
    function getCookie(name) {
        let nameEQ = name + "=";
        let ca = document.cookie.split(';');
        for(let i=0; i < ca.length; i++) {
            let c = ca[i];
            while (c.charAt(0) === ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    // --- DOM Elements ---
    const walletAmountEl = document.getElementById('walletAmount');
    const walletInputEl = document.getElementById('walletInput');
    const btnSetWallet = document.getElementById('btnSetWallet');
    const statusMessageEl = document.getElementById('statusMessage');

    // --- Wallet State ---
    let wallet;

    /**
     * Displays a temporary status message to the user with an animation.
     * @param {string} message - The message to display.
     * @param {number} duration - How long the message should be visible in milliseconds.
     */
    function showStatusMessage(message, duration = 2000) {
        statusMessageEl.innerHTML = message;
        statusMessageEl.style.display = 'block'; // Make it visible
        statusMessageEl.classList.remove('fade-out-animation'); // Ensure previous animation is reset
        statusMessageEl.classList.add('fade-in-animation'); // Trigger fade-in

        setTimeout(() => {
            statusMessageEl.classList.remove('fade-in-animation');
            statusMessageEl.classList.add('fade-out-animation'); // Trigger fade-out
            setTimeout(() => {
                statusMessageEl.style.display = 'none';
            }, 500); // Matches fade-out duration
        }, duration - 500); // Start fade-out 0.5s before total duration ends
    }

    /**
     * Updates the wallet display and saves the current wallet amount to a cookie.
     */
    function updateWalletDisplayAndCookie() {
        walletAmountEl.textContent = wallet;
        setCookie('casinoWallet', wallet, 365); // Save for 365 days
    }

    // --- Event Listeners ---
    btnSetWallet.addEventListener('click', () => {
        const newBalance = parseInt(walletInputEl.value);

        if (isNaN(newBalance) || newBalance < 0) {
            showStatusMessage("Please enter a valid positive number for your balance.", 2000);
            return;
        }

        wallet = newBalance;
        updateWalletDisplayAndCookie();
        showStatusMessage(`Wallet balance set to $${wallet}`, 1500);
        walletInputEl.value = ''; // Clear the input field after setting
    });

    // --- Initial Load ---
    window.onload = () => {
        const savedWallet = getCookie('casinoWallet');
        if (savedWallet && !isNaN(parseInt(savedWallet))) {
            wallet = parseInt(savedWallet);
        } else {
            wallet = 10000; // Default starting balance if no cookie exists or invalid
            showStatusMessage("Welcome! Your wallet has been set to $10000.", 2500);
        }
        updateWalletDisplayAndCookie(); // Display initial balance and ensure cookie is set
    };
</script>
