<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Reel Slot Machine - Quartz</title>
    <!-- Bootswatch Quartz Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts for a retro feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on desktop */
        }

        body {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem; /* Padding for small screens */
            background-color: var(--bs-body-bg);
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .reels-surface {
            background-color: #212529;
            border-radius: 15px;
            padding: 1rem;
            border: 3px solid #495057;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .reel-column {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .reel-symbol {
            background-color: #f8f9fa; /* White background */
            width: 130px;
            height: 90px;
            border-radius: 10px;
            border: 3px solid #6c757d; /* Gray border */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Roboto Condensed', sans-serif;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            overflow: hidden;
            color: black;
            font-size: 3.5rem;
        }
        
        .reel-symbol.chip { color: #0d6efd; } /* Blue poker chip */
        .reel-symbol.dice { color: #dc3545; } /* Red dice */
        .reel-symbol.bell { color: #ffc107; } /* Gold bell */
        .reel-symbol.crown { color: #ffc107; }
        .reel-symbol.wild {
            background: linear-gradient(45deg, #6a0dad, #ee82ee, #1e90ff, #00ced1);
            color: white;
            font-size: 2.5rem;
        }


        .payline {
            position: absolute;
            top: 50%;
            left: 2%;
            right: 2%;
            height: 5px;
            background-color: #e95420;
            transform: translateY(-50%);
            box-shadow: 0 0 10px #e95420;
            border-radius: 5px;
            opacity: 0.7;
            z-index: 10;
        }

        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
        }
        .actions-panel{
             border-top: 3px solid var(--quartz-secondary);
        }
        .betting-panel, .info-panel {
            border-top: 2px solid #212529;
         }

        .action-button, .bet-button {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s ease-in-out;
            padding: 0.75rem 0;
            width: 100%;
        }

        .action-button { font-size: 1.5rem; }
        .bet-button { font-size: 1rem; }

        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 2rem;
            font-family: 'Press Start 2P', cursive;
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }
        
        .info-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }
        .info-display span {
            color: var(--quartz-secondary);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            body {
                overflow: auto; /* Allow scroll on mobile if needed */
                align-items: flex-start; /* Align to top on mobile */
            }

            .game-console {
                padding: 1rem;
                margin-top: 1rem;
            }

            .reels-surface {
                gap: 0.5rem;
                padding: 0.5rem;
            }

            .reel-symbol {
                width: 80px;
                height: 60px;
                font-size: 2rem;
            }

            .reel-symbol.wild {
                font-size: 1.5rem;
            }

            .action-button { font-size: 1.2rem; }
            .bet-button { font-size: 0.8rem; }
            .info-display { font-size: 1rem; }

            .actions-panel, .betting-panel, .info-panel {
                padding: 0.75rem;
            }
        }

    </style>
</head>
<body>

    <div class="game-console">
        <div id="statusMessage" class="status-message"></div>
        <div class="reels-surface">
            <div class="payline"></div>
            <div class="reel-column" id="reel1">
                <div class="reel-symbol crown">👑</div>
                <div class="reel-symbol dice">🎲</div>
                <div class="reel-symbol chip">🔵</div>
            </div>
            <div class="reel-column" id="reel2">
                <div class="reel-symbol wild">WILD</div>
                <div class="reel-symbol bell">🔔</div>
                <div class="reel-symbol dice">🎲</div>
            </div>
            <div class="reel-column" id="reel3">
                <div class="reel-symbol crown">👑</div>
                <div class="reel-symbol chip">🔵</div>
                <div class="reel-symbol bell">🔔</div>
            </div>
        </div>
        <div class="actions-panel mt-3">
            <div class="row g-3 justify-content-center">
                <div class="col-12 col-sm-8">
                     <button id="btnSpin" class="btn btn-secondary action-button">Spin</button>
                </div>
            </div>
        </div>
        <div class="betting-panel mt-3">
             <div class="row g-2">
                <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="100">$100</button></div>
                <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="500">$500</button></div>
                <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="1000">$1000</button></div>
                <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button" data-bet="max">MAX</button></div>
            </div>
        </div>
        <div class="info-panel mt-3">
            <div class="row">
                <div class="col-6 info-display">Bet: $<span id="betAmount">100</span></div>
                <div class="col-6 info-display">Wallet: $<span id="walletAmount">10000</span></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DOM Elements ---
        const reelColumns = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const statusMessageEl = document.getElementById('statusMessage');
        const btnSpin = document.getElementById('btnSpin');
        const betButtons = document.querySelectorAll('.bet-button');
        const walletAmountEl = document.getElementById('walletAmount');
        const betAmountEl = document.getElementById('betAmount');

        // --- Game Config ---
        const symbols = [
            { id: 'CHIP', text: '🔵', class: 'chip' },
            { id: 'DICE', text: '🎲', class: 'dice' },
            { id: 'BELL', text: '🔔', class: 'bell' },
            { id: 'CROWN', text: '👑', class: 'crown' },
            { id: 'WILD', text: 'WILD', class: 'wild' }, // Wild card
        ];
        const payouts = {
            'CHIP': { 3: 10 },
            'DICE': { 3: 25 },
            'BELL': { 3: 50 },
            'CROWN': { 3: 100 },
            'WILD': { 3: 200 } // Jackpot
        };
        const spinDuration = 2000;
        const spinIntervalTime = 80;

        // --- Game State ---
        let wallet = 10000;
        let currentBet = 100;
        let isSpinning = false;

        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function createSymbolElement(symbol) {
            const el = document.createElement('div');
            el.classList.add('reel-symbol', symbol.class);
            el.textContent = symbol.text;
            return el;
        }

        function showStatusMessage(message, duration = 2000) {
            statusMessageEl.innerHTML = message;
            statusMessageEl.style.display = 'block';
            setTimeout(() => statusMessageEl.style.display = 'none', duration);
        }

        function updateButtonState(spinning) {
            isSpinning = spinning;
            btnSpin.disabled = isSpinning;
            betButtons.forEach(btn => btn.disabled = isSpinning);
        }
        
        function updateActiveBetButton(selectedBet) {
             betButtons.forEach(btn => {
                if(btn.dataset.bet === 'max' && selectedBet === wallet) {
                    btn.classList.add('active');
                } else if (parseInt(btn.dataset.bet) === selectedBet) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function checkWin(result) {
            const line = [result[0][1], result[1][1], result[2][1]]; // Middle symbols
            const lineIds = line.map(s => s.id);
            let winMultiplier = 0;
            let winMessage = '';

            // Check for 3 Wilds first (Jackpot)
            if (lineIds[0] === 'WILD' && lineIds[1] === 'WILD' && lineIds[2] === 'WILD') {
                winMultiplier = payouts['WILD'][3];
                winMessage = 'JACKPOT!';
            } else {
                // Check for other 3-of-a-kind, substituting wilds
                for (const symbolId in payouts) {
                    if (symbolId === 'WILD') continue; // Skip wild check here, it's done above

                    const count = lineIds.filter(id => id === symbolId || id === 'WILD').length;
                    
                    if (count === 3) {
                        const currentMultiplier = payouts[symbolId][3];
                        // Ensure we take the highest possible win
                        if (currentMultiplier > winMultiplier) {
                           winMultiplier = currentMultiplier;
                           winMessage = `${symbolId} x3!`;
                        }
                    }
                }
            }

            if (winMultiplier > 0) {
                const winnings = currentBet * winMultiplier;
                wallet += winnings;
                walletAmountEl.textContent = wallet;
                showStatusMessage(`${winMessage}<br>+$${winnings}`, 3000);
            }
        }
        
        function spinReels() {
            if (isSpinning) return;
            if (wallet < currentBet) {
                showStatusMessage("Not Enough Funds!");
                return;
            }

            wallet -= currentBet;
            walletAmountEl.textContent = wallet;
            updateButtonState(true);

            const finalResults = [];
            for(let i = 0; i < 3; i++) {
                finalResults.push([getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]);
            }

            const spinIntervals = [];

            reelColumns.forEach((column, i) => {
                const interval = setInterval(() => {
                    column.innerHTML = '';
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                }, spinIntervalTime);
                spinIntervals.push(interval);
            });

            // Stop reels sequentially
            reelColumns.forEach((column, i) => {
                setTimeout(() => {
                    clearInterval(spinIntervals[i]);
                    column.innerHTML = '';
                    finalResults[i].forEach(symbol => {
                        column.appendChild(createSymbolElement(symbol));
                    });
                    
                    // If this is the last reel to stop
                    if (i === reelColumns.length - 1) {
                         checkWin(finalResults);
                         updateButtonState(false);
                         if (wallet <= 0) showStatusMessage("Game Over!", 5000);
                    }
                }, spinDuration + (i * 500));
            });
        }

        // --- Event Listeners ---
        btnSpin.addEventListener('click', spinReels);
        
        betButtons.forEach(button => {
            button.addEventListener('click', () => {
                if(isSpinning) return;
                const betValue = button.dataset.bet;
                if (betValue === 'max') {
                    currentBet = wallet;
                } else {
                    currentBet = parseInt(betValue);
                }
                if (currentBet > wallet) currentBet = wallet;
                betAmountEl.textContent = currentBet;
                updateActiveBetButton(currentBet);
            });
        });

        // --- Initial Setup ---
        window.onload = () => {
            updateButtonState(false);
            updateActiveBetButton(currentBet);
        };
    </script>
</body>
</html>
