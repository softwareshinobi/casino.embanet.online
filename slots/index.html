    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            /* Defined custom colors for the new button style */
            --custom-pink-button: #e91e63; /* A specific pink for bet buttons */
            --custom-pink-button-hover: #ff4081; /* A brighter pink for hover */
            --custom-pink-button-active: #ff4081; /* A brighter pink for active, same as hover for strong effect */
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow-y: auto; /* Allow vertical scrolling on all screen sizes */
            overflow-x: hidden;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align content to the top below the fixed navbar */
            padding: 0.5rem;
            background-color: var(--bs-body-bg);
            box-sizing: border-box;
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 900px; /* Max width for consistency across games */
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
            margin-top: 1rem; /* Consistent spacing from navbar */
            margin-bottom: 20px; /* Consistent bottom spacing */
        }

        .reels-surface {
            background-color: #212529;
            border-radius: 15px;
            padding: 1rem;
            border: 3px solid #495057;
            box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.7);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .reel-column {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .reel-symbol {
            background-color: #f8f9fa; /* White background */
            width: 130px;
            height: 90px;
            border-radius: 10px;
            border: 3px solid #6c757d; /* Gray border */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
            overflow: hidden;
            color: black;
            font-size: 3.5rem;
        }

        .reel-symbol.chip { color: #0d6efd; }
        .reel-symbol.dice { color: #dc3545; }
        .reel-symbol.bell { color: #ffc107; }
        .reel-symbol.crown { color: #ffc107; }
        .reel-symbol.wild {
            background: linear-gradient(45deg, #6a0dad, #ee82ee, #1e90ff, #00ced1);
            color: white;
            font-size: 2.5rem;
        }

        .payline {
            position: absolute;
            top: 50%;
            left: 2%;
            right: 2%;
            height: 5px;
            background-color: #e95420;
            transform: translateY(-50%);
            box-shadow: 0 0 10px #e95420;
            border-radius: 5px;
            opacity: 0.7;
            z-index: 10;
        }

        /* Action and Bet Panels - General Styling */
        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
        }
        .actions-panel{ border-top: 3px solid var(--quartz-secondary); }
        .betting-panel, .info-panel { border-top: 2px solid #212529; }

        /* Action and Bet Buttons - General Styling */
        .action-button, .bet-button {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s ease-in-out;
            padding: 0.75rem 0;
            width: 100%;
        }
        .action-button { font-size: 1.5rem; }
        .bet-button { font-size: 1rem; }

        /* --- Specific Bet Button Styles (from Roulette/Craps based on image) --- */
        .betting-panel .bet-button {
            background-color: var(--custom-pink-button); /* Solid pink background */
            border: none; /* Remove default border */
            color: var(--quartz-light); /* Light text color */
            box-shadow: none; /* Remove any default box-shadow */
            border-radius: 0.375rem; /* Bootstrap default border-radius for consistency */
        }

        .betting-panel .bet-button:hover {
            background-color: var(--custom-pink-button-hover); /* Brighter pink on hover */
            border-color: var(--custom-pink-button-hover); /* Match border color on hover */
            box-shadow: 0 0 10px rgba(var(--bs-primary-rgb),.5); /* Example light shadow on hover */
        }

        .betting-panel .bet-button.active {
            background-color: var(--custom-pink-button-active); /* Brighter pink when active */
            border: 2px solid var(--quartz-secondary); /* Use secondary color for active border */
            box-shadow: 0 0 15px rgba(24, 178, 178, 0.7); /* Stronger glow for active state */
            color: var(--quartz-light); /* Maintain light text color */
        }
        /* --- End Specific Bet Button Styles --- */

        /* --- Specific Info Panel Styles (from Roulette/Craps based on image) --- */
        .info-panel {
            background-color: var(--quartz-dark); /* Darker background for info panel */
            border: 2px solid var(--quartz-secondary); /* Secondary border for info panel */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5); /* Inner shadow for depth */
            padding: 1.2rem 1.5rem; /* Slightly reduced padding for Slots compared to larger Roulette */
        }

        .info-display {
            font-size: 1.5rem; /* Larger font size for readability */
            font-weight: 700;
            color: var(--quartz-light); /* Main text color */
            text-align: center;
        }

        .info-display span {
            color: var(--quartz-secondary); /* Highlighted values */
        }
        /* --- End Specific Info Panel Styles --- */


        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 2rem;
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .game-console {
                padding: 1rem;
                margin-top: 1rem; /* Keep consistent margin for mobile too */
                margin-bottom: 10px; /* Adjust bottom margin for mobile */
            }

            .reels-surface {
                gap: 0.5rem;
                padding: 0.5rem;
            }

            .reel-symbol {
                width: 80px;
                height: 60px;
                font-size: 2rem;
            }

            .reel-symbol.wild {
                font-size: 1.5rem;
            }

            .action-button { font-size: 1.2rem; }
            .bet-button { font-size: 0.8rem; }
            /* info-display font size will be overridden below for mobile */

            .actions-panel, .betting-panel, .info-panel {
                padding: 0.75rem;
            }

            /* Mobile adjustments for custom buttons/panels */
            .betting-panel .bet-button {
                font-size: 0.8rem; /* Smaller font on mobile for these buttons */
                border: none; /* Mobile buttons also shouldn't have default border */
                box-shadow: none;
            }
            .betting-panel .bet-button.active {
                border: 1px solid var(--quartz-secondary); /* Thinner border for active on mobile */
                box-shadow: 0 0 10px rgba(24, 178, 178, 0.5); /* Less intense glow on mobile */
            }

            .info-panel {
                padding: 0.75rem; /* Smaller padding on mobile */
            }
            .info-display {
                font-size: 1rem; /* Smaller font for info display on mobile */
            }
        }
    </style>
</head>

<script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- DOM Elements ---
        const reelColumns = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3')
        ];
        const statusMessageEl = document.getElementById('statusMessage');
        const btnSpin = document.getElementById('btnSpin');
        const betButtons = document.querySelectorAll('.bet-button');
        const walletAmountEl = document.getElementById('walletAmount');
        const betAmountEl = document.getElementById('betAmount');

        // --- Game Config ---
        const symbols = [
            { id: 'CHIP', text: '🔵', class: 'chip' },
            { id: 'DICE', text: '🎲', class: 'dice' },
            { id: 'BELL', text: '🔔', class: 'bell' },
            { id: 'CROWN', text: '👑', class: 'crown' },
            { id: 'WILD', text: 'WILD', class: 'wild' }, // Wild card
        ];
        const payouts = {
            'CHIP': { 3: 10 },
            'DICE': { 3: 25 },
            'BELL': { 3: 50 },
            'CROWN': { 3: 100 },
            'WILD': { 3: 200 } // Jackpot
        };
        const spinDuration = 2000;
        const spinIntervalTime = 80;

        // --- Game State ---
        let wallet;
        let currentBet = 100;
        let isSpinning = false;

        // --- Cookie Functions ---
        function setCookie(name, value, days) {
            let expires = "";
            if (days) {
                let date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = "; expires=" + date.toUTCString();
            }
            document.cookie = name + "=" + (value || "") + expires + "; path=/";
        }

        function getCookie(name) {
            let nameEQ = name + "=";
            let ca = document.cookie.split(';');
            for(let i=0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // --- Wallet Initialization ---
        function initializeWallet() {
            const savedWallet = getCookie('casinoWallet');
            if (savedWallet && !isNaN(parseInt(savedWallet))) {
                wallet = parseInt(savedWallet);
            } else {
                wallet = 10000; // Default starting balance
                setCookie('casinoWallet', wallet, 365); // Create the cookie
                alert("Welcome! A new starting balance of $10,000 has been set for the casino.");
            }
            walletAmountEl.textContent = wallet;
        }


        function getRandomSymbol() {
            return symbols[Math.floor(Math.random() * symbols.length)];
        }

        function createSymbolElement(symbol) {
            const el = document.createElement('div');
            el.classList.add('reel-symbol', symbol.class);
            el.textContent = symbol.text;
            return el;
        }

        function showStatusMessage(message, duration = 1000) {
            statusMessageEl.innerHTML = message;
            statusMessageEl.style.display = 'block';
            setTimeout(() => statusMessageEl.style.display = 'none', duration);
        }

        function updateButtonState(spinning) {
            isSpinning = spinning;
            btnSpin.disabled = isSpinning;
            betButtons.forEach(btn => btn.disabled = isSpinning);
        }

        function updateActiveBetButton(selectedBet) {
             betButtons.forEach(btn => {
                if(btn.dataset.bet === 'max' && selectedBet === wallet) {
                    btn.classList.add('active');
                } else if (parseInt(btn.dataset.bet) === selectedBet) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        function checkWin(result) {
            const line = [result[0][1], result[1][1], result[2][1]]; // Middle symbols
            const lineIds = line.map(s => s.id);
            let winMultiplier = 0;
            let winMessage = '';

            // Check for 3 Wilds first (Jackpot)
            if (lineIds[0] === 'WILD' && lineIds[1] === 'WILD' && lineIds[2] === 'WILD') {
                winMultiplier = payouts['WILD'][3];
                winMessage = 'JACKPOT!';
            } else {
                // Check for other 3-of-a-kind, substituting wilds
                for (const symbolId in payouts) {
                    if (symbolId === 'WILD') continue; // Skip wild check here, it's done above

                    const count = lineIds.filter(id => id === symbolId || id === 'WILD').length;

                    if (count === 3) {
                        const currentMultiplier = payouts[symbolId][3];
                        // Ensure we take the highest possible win
                        if (currentMultiplier > winMultiplier) {
                           winMultiplier = currentMultiplier;
                           winMessage = `${symbolId} x3!`;
                        }
                    }
                }
            }

            if (winMultiplier > 0) {
                const winnings = currentBet * winMultiplier;
                wallet += winnings;
                showStatusMessage(`${winMessage}<br>+$${winnings}`, 1000);
            }

            walletAmountEl.textContent = wallet;
            setCookie('casinoWallet', wallet, 365); // Save wallet after win/loss check
        }

        function spinReels() {
            if (isSpinning) return;
            if (wallet < currentBet) {
                showStatusMessage("Not Enough Funds!");
                return;
            }

            wallet -= currentBet;
            walletAmountEl.textContent = wallet;
            setCookie('casinoWallet', wallet, 365); // Save wallet before spin
            updateButtonState(true);

            const finalResults = [];
            for(let i = 0; i < 3; i++) {
                finalResults.push([getRandomSymbol(), getRandomSymbol(), getRandomSymbol()]);
            }

            const spinIntervals = [];

            reelColumns.forEach((column, i) => {
                const interval = setInterval(() => {
                    column.innerHTML = '';
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                    column.appendChild(createSymbolElement(getRandomSymbol()));
                }, spinIntervalTime);
                spinIntervals.push(interval);
            });

            // Stop reels sequentially
            reelColumns.forEach((column, i) => {
                setTimeout(() => {
                    clearInterval(spinIntervals[i]);
                    column.innerHTML = '';
                    finalResults[i].forEach(symbol => {
                        column.appendChild(createSymbolElement(symbol));
                    });

                    // If this is the last reel to stop
                    if (i === reelColumns.length - 1) {
                         checkWin(finalResults);
                         updateButtonState(false);
                         if (wallet <= 0) showStatusMessage("Game Over!", 5000);
                    }
                }, spinDuration + (i * 500));
            });
        }

        // --- Event Listeners ---
        btnSpin.addEventListener('click', spinReels);

        betButtons.forEach(button => {
            button.addEventListener('click', () => {
                if(isSpinning) return;
                const betValue = button.dataset.bet;
                if (betValue === 'max') {
                    currentBet = wallet;
                } else {
                    currentBet = parseInt(betValue);
                }
                if (currentBet > wallet) currentBet = wallet;
                betAmountEl.textContent = currentBet;
                updateActiveBetButton(currentBet);
            });
        });

        // --- Initial Setup ---
        window.onload = () => {
            initializeWallet();
            updateButtonState(false);
            updateActiveBetButton(currentBet);
        };
    </script>
