<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casino Portal - Quartz</title>
    <!-- Bootswatch Quartz Theme -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts for a retro feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on desktop */
        }

        body {
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem; /* Padding for small screens */
            background-color: var(--bs-body-bg);
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .portal-header {
            text-align: center;
            border-bottom: 2px solid var(--quartz-secondary);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
        }

        .portal-header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.5rem;
            color: var(--quartz-light);
        }

        .portal-header p {
            font-size: 1.1rem;
            color: var(--bs-gray-400);
            max-width: 600px;
            margin: 1rem auto 0;
        }

        .game-links .btn {
            padding: 1rem;
            font-size: 1.25rem;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .game-links .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            filter: brightness(1.1);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            body { overflow: auto; align-items: flex-start; }
            .game-console { padding: 1rem; margin-top: 1rem; }
            .portal-header h1 { font-size: 1.8rem; }
            .portal-header p { font-size: 1rem; }
            .game-links .btn { font-size: 1rem; padding: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="game-console">
        
        <div class="portal-header">
            <h1 class="display-4">Casino Portal</h1>
            <p class="lead">
                A curated selection of classic games, rebuilt and upgraded. Pick a game below to begin.
            </p>
        </div>

        <div class="row g-3 game-links">
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="blackjack/index.html">Blackjack</a>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="casinowar/index.html">Casino War</a>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="baccarat/index.html">Baccarat</a>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="slots/index.html">Slots</a>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="roulette/index.html">Roulette</a>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <a class="btn btn-secondary btn-lg d-block" href="craps/index.html">Craps</a>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS is not strictly necessary for this static page but included for consistency -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
