    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --surrender-red: #B71C1C;
        }

        html, body {
            height: 100%;
            margin: 0;
            /* Allow vertical scrolling on all screen sizes */
            overflow-y: auto;
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        body {
            /* Use a consistent system font stack */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            /* Align items to the top to respect padding-top */
            align-items: flex-start;
            padding: 0.5rem; /* Padding for small screens (sides) */
            background-color: var(--bs-body-bg);
            box-sizing: border-box; /* Include padding in element's total width and height */
            /* min-height and flex-direction for stacking already handled by flex properties */
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1; /* Ensure it's above the background if any */
            /* Add a top margin for consistent spacing below the fixed navbar */
            margin-top: 1rem;
            margin-bottom: 20px; /* Add some space at the bottom */
        }

        .playing-surface {
            background-color: var(--quartz-dark);
            border-radius: 15px;
            padding: 1rem;
            border: 3px solid #495057;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 250px;
        }

        .hand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .hand-area {
            min-height: 125px; /* Adjust height */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hand-label {
            font-size: 1rem;
            color: var(--quartz-light);
            text-transform: uppercase;
        }

        .card {
            width: 80px;
            height: 120px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #333;
            color: black;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .card .suit { font-size: 1.5rem; line-height: 1; }
        .card.red { color: #e95420; }
        .card.black { color: #212121; }
        .card-top { align-self: flex-start; }
        .card-bottom { align-self: flex-end; transform: rotate(180deg); }

        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
        }
        .actions-panel{
            border-top: 3px solid var(--quartz-secondary);
        }
        .betting-panel, .info-panel {
            border-top: 2px solid #212529;
           }

        .action-button, .bet-button {
            /* Use system font for consistency */
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s ease-in-out;
            padding: 0.75rem 0;
            width: 100%;
        }

        .btn-surrender {
            background-color: var(--surrender-red);
            border-color: var(--surrender-red);
        }

        .action-button { font-size: 1.2rem; }
        .bet-button { font-size: 1rem; }

        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 2rem;
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }

        /* Updated info-display styles to match Craps' for better mobile responsiveness */
        .info-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }
        .info-display span {
            color: var(--quartz-secondary);
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            /* Body overflow and alignment already handled globally */
            .game-console {
                padding: 1rem;
                margin-top: 1rem; /* Keep consistent margin for mobile too */
                margin-bottom: 10px; /* Adjust bottom margin for mobile */
            }
            .hand-area { min-height: 105px; gap: 5px; }
            .card { width: 60px; height: 90px; font-size: 1.5rem; }
            .card .suit { font-size: 1rem; }
            .action-button { font-size: 1rem; }
            .bet-button { font-size: 0.8rem; }
            .info-display { font-size: 1rem; } /* Override for smaller font on mobile */
            .actions-panel, .betting-panel, .info-panel { padding: 0.75rem; }
        }
    </style>

</head>
