    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --roulette-felt: #343f56; /* Changed to match theme */
            --bet-red: #B71C1C;
            --bet-black: #212121;
            /* Defined custom colors for the new button style */
            --custom-pink-button: #e91e63; /* A specific pink for bet buttons */
            --custom-pink-button-hover: #ff4081; /* A brighter pink for hover */
            --custom-pink-button-active: #ff4081; /* A brighter pink for active, same as hover for strong effect */
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow-y: auto; /* Keep auto overflow for flexibility */
            overflow-x: hidden;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align content to the top below the fixed navbar */
            padding: 0.5rem;
            background-color: var(--bs-body-bg);
            box-sizing: border-box;
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1rem;
            width: 100%;
            max-width: 1200px; /* Maintained the larger max-width */
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
            margin-top: 1rem; /* Consistent spacing from navbar */
            margin-bottom: 20px; /* Consistent bottom spacing */
        }

        .playing-surface {
            background-color: var(--roulette-felt);
            border-radius: 15px;
            padding: 1.8rem; /* Scaled padding */
            border: 3px solid #495057;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: grid;
            grid-template-columns: 1.2fr 2.8fr; /* Adjusted for larger wheel area */
            gap: 1.8rem; /* Scaled gap */
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #212529;
            border-radius: 10px;
            padding: 1.2rem; /* Scaled padding */
            min-height: 240px; /* Scaled min-height */
        }

        .winning-number-display {
            font-size: 4.8rem; /* Scaled font size */
            width: 100%;
            height: auto;
            min-height: 144px; /* Scaled min-height */
            line-height: 1.2;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            border: 4px solid #495057;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff; /* Ensure text color is white */
            border-radius: 10px; /* Make sure it's rounded */
        }

        /* Betting Mat Layout (internal structure, scaled) */
        .betting-layout-container { display: flex; flex-direction: column; gap: 10px; }
        .main-betting-grid { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
        .zeros-area { display: grid; gap: 5px; }
        .numbers-and-cols-container { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
        .numbers-area { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; }
        .cols-area { display: grid; grid-template-rows: repeat(3, 1fr); gap: 5px; }
        .outside-bets-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }

        .bet-area {
            padding: 0.6rem; /* Scaled padding */
            font-size: 1.3rem; /* Scaled font size */
            font-weight: bold;
            border: 1px solid #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 42px; /* Scaled min-height */
            text-align: center;
        }

        .bet-area:hover { background-color: rgba(255,255,255,0.2); }
        .bet-area.red { background-color: var(--bet-red); }
        .bet-area.black { background-color: var(--bet-black); }
        .bet-area.zero { background-color: #006847; grid-column: 1 / -1; }

        .bet-area .chip {
            position: absolute;
            bottom: 5px; right: 5px; /* Adjusted position */
            background: #ffc107; color: #000;
            border-radius: 50%;
            padding: 0 6px; /* Scaled padding */
            font-size: 0.9rem; /* Scaled font size */
            line-height: 1.2;
            min-width: 26px; /* Scaled min-width */
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* Action and Bet Panels - General Styling */
        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 15px;
        }
        .actions-panel{ border-top: 3px solid var(--quartz-secondary); }
        .betting-panel, .info-panel { border-top: 2px solid #212529; }

        /* Action and Bet Buttons - General Styling */
        .action-button, .bet-button {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            padding: 0.9rem 0; /* Scaled padding */
            width: 100%;
        }
        .action-button { font-size: 1.4rem; } /* Scaled font size */
        .bet-button { font-size: 1.2rem; } /* Scaled font size */

        /* --- Specific Bet Button Styles (to match image) --- */
        .betting-panel .bet-button {
            background-color: var(--custom-pink-button); /* Solid pink background */
            border: none; /* Remove default border */
            color: var(--quartz-light); /* Light text color */
            box-shadow: none; /* Remove any default box-shadow */
            border-radius: 0.375rem; /* Bootstrap default border-radius for consistency */
        }

        .betting-panel .bet-button:hover {
            background-color: var(--custom-pink-button-hover); /* Brighter pink on hover */
            border-color: var(--custom-pink-button-hover); /* Match border color on hover */
            box-shadow: 0 0 10px rgba(var(--bs-primary-rgb),.5); /* Example light shadow on hover */
        }

        .betting-panel .bet-button.active {
            background-color: var(--custom-pink-button-active); /* Brighter pink when active */
            border: 2px solid var(--quartz-secondary); /* Use secondary color for active border */
            box-shadow: 0 0 15px rgba(24, 178, 178, 0.7); /* Stronger glow for active state */
            color: var(--quartz-light); /* Maintain light text color */
        }
        /* --- End Specific Bet Button Styles --- */


        /* --- Specific Info Panel Styles (to match image) --- */
        .info-panel {
            background-color: var(--quartz-dark); /* Darker background for info panel */
            border: 2px solid var(--quartz-secondary); /* Secondary border for info panel */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5); /* Inner shadow for depth */
            padding: 1.2rem 1.8rem; /* Scaled padding */
        }

        .info-display {
            font-size: 1.8rem; /* Scaled font size for readability */
            font-weight: 700;
            color: var(--quartz-light); /* Main text color */
            text-align: center;
        }

        .info-display span {
            color: var(--quartz-secondary); /* Highlighted values */
        }
        /* --- End Specific Info Panel Styles --- */


        .status-message {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9); color: var(--quartz-secondary);
            font-size: 1.8rem; /* Scaled font size */
            padding: 1.8rem; /* Scaled padding */
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary); z-index: 100; text-align: center;
            display: none; width: 90%;
        }

        @media (max-width: 768px) {
            .game-console { padding: 0.5rem; margin-top: 1rem; }
            .playing-surface {
                grid-template-columns: 1fr; /* Stack on mobile */
                padding: 1rem; /* Revert to mobile padding */
                gap: 1rem; /* Revert to mobile gap */
            }
            .wheel-container { height: auto; min-height: initial; padding: 1rem; } /* Revert mobile padding */
            .winning-number-display { height: 100px; line-height: 70px; font-size: 3rem; min-height: initial; min-width: initial; }
            /* Revert mobile specific sizes for betting mat elements */
            .betting-layout-container { gap: 3px; }
            .main-betting-grid { gap: 3px; }
            .zeros-area { gap: 1px; }
            .numbers-and-cols-container { gap: 3px; }
            .numbers-area { gap: 1px; }
            .cols-area { gap: 1px; }
            .outside-bets-container { grid-template-columns: repeat(3, 1fr); gap: 1px; }
            .bet-area { font-size: 0.6rem; padding: 0.1rem; min-height: 25px; }
            .bet-area .chip { bottom: 1px; right: 1px; padding: 0 3px; font-size: 0.6rem; min-width: 16px; }
            .action-button { font-size: 1rem; padding: 0.75rem 0; }
            .bet-button { font-size: 0.8rem; padding: 0.75rem 0; }
            .info-panel { padding: 0.75rem; }
            .info-display { font-size: 1rem; }
            .status-message { font-size: 1.5rem; padding: 1.5rem; }

            /* Ensure custom button styles adjust for mobile too */
            .betting-panel .bet-button {
                font-size: 0.8rem; /* Keep original smaller font for mobile */
                border: none; /* Mobile buttons also shouldn't have default border */
                box-shadow: none;
            }
            .betting-panel .bet-button.active {
                border: 1px solid var(--quartz-secondary); /* Thinner border for active on mobile */
                box-shadow: 0 0 10px rgba(24, 178, 178, 0.5); /* Less intense glow on mobile */
            }
        }
    </style>

</head>
