<!DOCTYPE html>

<html lang="en">

<head>

    <title>Blackjack / Shinobi Casino</title>

<!-- html / styling / begin -->

<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Roboto+Condensed:wght@700&amp;display=swap" rel="stylesheet">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="/assets/css/global.css">

<!-- html / styling / end -->

    <link href="blackjack.css" rel="stylesheet">

</head>

<body>

<!-- html / menu / begin -->

<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">

<div class="container-fluid">

<a class="navbar-brand" href="/">Shinobi Casino</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

<span class="navbar-toggler-icon"></span>

</button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="/games/blackjack/index.html">Blackjack</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/games/casinowar/index.html">Casino War</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/games/baccarat/baccarat.html">Baccarat</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/games/craps/craps.html">Craps</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- html / menu / end -->

<div class="game-console">
        <div id="statusMessage" class="status-message"></div>

        <div class="playing-surface">
            <div class="hand-container">
                <div class="hand-header">
                    <span class="hand-label">Dealer</span>
                    <span id="dealerScore" class="score-display">0</span>
                </div>
                <div id="dealerHand" class="hand-area"></div>
            </div>

            <div class="hand-container mt-3">
                        <div class="hand-header">
                    <span class="hand-label">Player</span>
                    <span id="playerScore" class="score-display">0</span>
                </div>
                <div id="playerHand" class="hand-area"></div>
            </div>
        </div>

        <div class="actions-panel mt-2">
            <div id="playerActionButtons" class="row" style="display: none;">
                <div class="col-4"><button id="btnHit" class="btn btn-success action-button" disabled>Hit</button></div>
                <div class="col-4"><button id="btnStand" class="btn btn-primary action-button" disabled>Stand</button></div>
                <div class="col-4"><button id="btnDouble" class="btn btn-warning action-button" disabled>Double</button></div>

                  </div>
      <div id="btnDeal" class="col-12"><button  class="btn btn-info action-button">Deal</button></div>

        </div>

        <div class="betting-panel mt-2">
    <div class="row g-2">
        <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button bet-value-button" data-bet="1000" style="background-color: black; color: white; border-color: black;">$1000</button></div>
        <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button bet-value-button" data-bet="5000" style="background-color: purple; color: white; border-color: purple;">$5000</button></div>
        <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button bet-value-button active" data-bet="10000" style="background-color: yellow; color: black; border-color: yellow;">$10000</button></div>
        <div class="col-6 col-sm-3"><button class="btn btn-primary bet-button bet-value-button" data-bet="50000" style="background-color: orange; color: white; border-color: orange;">$50000</button></div>
    </div>
            <div class="row g-2 mt-0">
                <div class="col-12">
                    <button id="btnClearBet" class="btn btn-secondary bet-button w-100">Clear Bet</button>
                </div>
            </div>
        </div>

        <div class="info-panel mt-2">
            <div class="row">
                <div class="col-12 col-sm-6 info-display mb-2 mb-sm-0">Bet: $<span id="betAmount">--</span></div>
                <div class="col-12 col-sm-6 info-display">Wallet: $<span id="walletAmount">--</span></div>
            </div>
        </div>
    </div>

<!-- html / scripting / begin -->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="/assets/js/common.js"></script>

<!-- html / scripting / end -->

<script src="blackjack.js"></script>

</body>

</html>
