<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/quartz/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Roboto+Condensed:wght@700&amp;display=swap" rel="stylesheet">
    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --roulette-felt: #343f56; /* Changed to match theme */
            --bet-red: #B71C1C;
            --bet-black: #212121;
            --custom-pink-button: #e91e63; /* A specific pink for bet buttons */
            --custom-pink-button-active: #ff4081; /* A brighter pink for active */
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow-y: auto;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0.5rem;
            background-color: var(--bs-body-bg);
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1rem;
            width: 100%;
            /* Increased max-width by ~20% (1000px -> 1200px) */
            max-width: 1200px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1;
            margin-top: 1rem;
            margin-bottom: 20px;
        }

        .playing-surface {
            background-color: var(--roulette-felt);
            border-radius: 15px;
            /* Increased padding */
            padding: 1.8rem; /* Scaled from 1.5rem by approx 20% */
            border: 3px solid #495057;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: grid;
            /* Adjusted grid-template-columns for better balance within wider layout */
            grid-template-columns: 1.2fr 2.8fr; /* Adjusted for larger wheel area, can be fine-tuned */
            /* Increased gap */
            gap: 1.8rem; /* Scaled from 1.5rem by approx 20% */
        }

        .wheel-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #212529;
            border-radius: 10px;
            /* Increased padding */
            padding: 1.2rem; /* Scaled from 1rem by approx 20% */
            min-height: 240px; /* Scaled from 200px */
        }

        .winning-number-display {
            /* Increased font size for desktop */
            font-size: 4.8rem; /* Scaled from 4rem */
            width: 100%;
            height: auto;
            min-height: 144px; /* Scaled from 120px */
            line-height: 1.2;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            border: 4px solid #495057;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* New structured betting layout */
        .betting-layout-container {
            display: flex;
            flex-direction: column;
            /* Increased gap */
            gap: 10px; /* Scaled from 8px */
        }
        .main-betting-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            /* Increased gap */
            gap: 10px; /* Scaled from 8px */
        }
        .zeros-area {
            display: grid;
            /* Increased gap */
            gap: 5px; /* Scaled from 4px */
        }
        .numbers-and-cols-container {
            display: grid;
            grid-template-columns: 1fr auto;
            /* Increased gap */
            gap: 10px; /* Scaled from 8px */
        }
        .numbers-area {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            /* Increased gap */
            gap: 5px; /* Scaled from 4px */
        }
        .cols-area {
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            /* Increased gap */
            gap: 5px; /* Scaled from 4px */
        }
        .outside-bets-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            /* Increased gap */
            gap: 5px; /* Scaled from 4px */
        }

        .bet-area {
            /* Increased padding for larger clickable area and better look */
            padding: 0.6rem; /* Scaled from 0.5rem */
            text-align: center;
            /* Significantly increased font size for desktop readability */
            font-size: 1.3rem; /* Scaled from 1.1rem */
            font-weight: bold;
            border: 1px solid #fff;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Added min-height to ensure cells have sufficient height */
            min-height: 42px; /* Scaled from 35px */
        }

        .bet-area:hover { background-color: rgba(255,255,255,0.2); }
        .bet-area.red { background-color: var(--bet-red); }
        .bet-area.black { background-color: var(--bet-black); }
        .bet-area.zero { background-color: #006847; grid-column: 1 / -1; }

        .bet-area .chip {
            position: absolute;
            /* Adjusted position due to increased padding */
            bottom: 5px; right: 5px; /* Scaled from 4px */
            background: #ffc107; color: #000;
            border-radius: 50%;
            /* Increased padding/min-width for chip text */
            padding: 0 6px; /* Scaled from 0 5px */
            font-size: 0.9rem; /* Scaled from 0.8rem */
            line-height: 1.2;
            min-width: 26px; /* Scaled from 22px */
            text-align: center;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2); padding: 1rem; border-radius: 15px;
        }
        .actions-panel{ border-top: 3px solid var(--quartz-secondary); }
        .betting-panel, .info-panel { border-top: 2px solid #212529; }
        .action-button, .bet-button {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700; text-transform: uppercase;
            /* Increased padding */
            padding: 0.9rem 0; /* Scaled from 0.75rem */
            width: 100%;
        }
        .action-button {
            /* Increased font size */
            font-size: 1.4rem; /* Scaled from 1.2rem */
        }
        .bet-button {
            /* Increased font size */
            font-size: 1.2rem; /* Scaled from 1rem */
        }

        /* --- Custom Bet Button Styles (Matching the image) --- */
        .betting-panel .bet-button {
            background-color: var(--custom-pink-button);
            border-color: var(--custom-pink-button);
            color: var(--quartz-light);
            box-shadow: none;
            font-weight: 700;
        }

        .betting-panel .bet-button:hover {
            background-color: var(--custom-pink-button-active);
            border-color: var(--custom-pink-button-active);
        }

        .betting-panel .bet-button.active {
            background-color: var(--custom-pink-button-active);
            border-color: var(--quartz-secondary);
            box-shadow: 0 0 15px rgba(24, 178, 178, 0.7);
            color: var(--quartz-light);
        }
        /* --- End Custom Bet Button Styles --- */


        /* --- Custom Info Panel Styles (Matching the image) --- */
        .info-panel {
            background-color: var(--quartz-dark);
            border: 2px solid var(--quartz-secondary);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            /* Increased padding */
            padding: 1.2rem 1.8rem; /* Scaled from 1rem 1.5rem */
        }

        .info-display {
            /* Increased font size for readability */
            font-size: 1.8rem; /* Scaled from 1.5rem */
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }

        .info-display span {
            color: var(--quartz-secondary);
        }
        /* --- End Custom Info Panel Styles --- */

        .status-message {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9); color: var(--quartz-secondary);
            /* Increased font size */
            font-size: 1.8rem; /* Scaled from 1.5rem */
             padding: 1.8rem; /* Scaled from 1.5rem */
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary); z-index: 100; text-align: center;
            display: none; width: 90%;
        }

        @media (max-width: 768px) {
            .game-console { padding: 0.5rem; margin-top: 1rem; }
            .playing-surface {
                grid-template-columns: 1fr; /* Stack on mobile */
                padding: 1rem; /* Revert to mobile padding */
                gap: 1rem; /* Revert to mobile gap */
            }
            .wheel-container { height: auto; min-height: initial; padding: 1rem; } /* Revert mobile padding */
            .winning-number-display { height: 100px; line-height: 70px; font-size: 3rem; min-height: initial; min-width: initial; }
            /* Revert mobile specific sizes for betting mat elements */
            .betting-layout-container { gap: 3px; }
            .main-betting-grid { gap: 3px; }
            .zeros-area { gap: 1px; }
            .numbers-and-cols-container { gap: 3px; }
            .numbers-area { gap: 1px; }
            .cols-area { gap: 1px; }
            .outside-bets-container { grid-template-columns: repeat(3, 1fr); gap: 1px; }
            .bet-area { font-size: 0.6rem; padding: 0.1rem; min-height: 25px; }
            .bet-area .chip { bottom: 1px; right: 1px; padding: 0 3px; font-size: 0.6rem; min-width: 16px; }
            .action-button { font-size: 1rem; padding: 0.75rem 0; }
            .bet-button { font-size: 0.8rem; padding: 0.75rem 0; }
            .info-panel { padding: 0.75rem; }
            .info-display { font-size: 1rem; }
            .status-message { font-size: 1.5rem; padding: 1.5rem; } /* Revert status message font size on mobile */

            /* Ensure custom button styles adjust for mobile too */
            .betting-panel .bet-button {
                font-size: 0.8rem; /* Keep original smaller font for mobile */
            }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const bettingMatContainer = document.getElementById('bettingMat');
        const walletAmountEl = document.getElementById('walletAmount');
        const totalBetAmountEl = document.getElementById('totalBetAmount');
        const betButtons = document.querySelectorAll('.bet-button');
        const btnSpin = document.getElementById('btnSpin');
        const btnClear = document.getElementById('btnClear');
        const winningNumberDisplay = document.getElementById('winningNumberDisplay');
        const statusMessageEl = document.getElementById('statusMessage');

        let wallet = 10000;
        let currentBetAmount = 100;
        let bets = {};
        let isSpinning = false;

        const wheelNumbers = [
            '0', '28', '9', '26', '30', '11', '7', '20', '32', '17', '5', '22', '34', '15', '3', '24', '36', '13', '1',
            '00', '27', '10', '25', '29', '12', '8', '19', '31', '18', '6', '21', '33', '16', '4', '23', '35', '14', '2'
        ];

        const numberProperties = {
            '0': { color: 'green' }, '00': { color: 'green' },
            '1': { color: 'red', col: 1, dozen: 1 }, '2': { color: 'black', col: 2, dozen: 1 }, '3': { color: 'red', col: 3, dozen: 1 }, '4': { color: 'black', col: 1, dozen: 1 }, '5': { color: 'red', col: 2, dozen: 1 }, '6': { color: 'black', col: 3, dozen: 1 }, '7': { color: 'red', col: 1, dozen: 1 }, '8': { color: 'black', col: 2, dozen: 1 }, '9': { color: 'red', col: 3, dozen: 1 }, '10': { color: 'black', col: 1, dozen: 1 }, '11': { color: 'black', col: 2, dozen: 1 }, '12': { color: 'red', col: 3, dozen: 1 }, '13': { color: 'black', col: 1, dozen: 2 }, '14': { color: 'red', col: 2, dozen: 2 }, '15': { color: 'black', col: 3, dozen: 2 }, '16': { color: 'red', col: 1, dozen: 2 }, '17': { color: 'black', col: 2, dozen: 2 }, '18': { color: 'red', col: 3, dozen: 2 }, '19': { color: 'red', col: 1, dozen: 2 }, '20': { color: 'black', col: 2, dozen: 2 }, '21': { color: 'red', col: 3, dozen: 2 }, '22': { color: 'black', col: 1, dozen: 3 }, '23': { color: 'red', col: 2, dozen: 3 }, '24': { color: 'black', col: 3, dozen: 3 }, '25': { color: 'red', col: 1, dozen: 3 }, '26': { color: 'black', col: 2, dozen: 3 }, '27': { color: 'red', col: 3, dozen: 3 }, '28': { color: 'black', col: 1, dozen: 3 }, '29': { color: 'black', col: 2, dozen: 3 }, '30': { color: 'red', col: 3, dozen: 3 }, '31': { color: 'black', col: 1, dozen: 3 }, '32': { color: 'red', col: 2, dozen: 3 }, '33': { color: 'black', col: 3, dozen: 3 }, '34': { color: 'red', col: 1, dozen: 3 }, '35': { color: 'black', col: 2, dozen: 3 }, '36': { color: 'red', col: 3, dozen: 3 }
        };

        function createBettingMat() {
            bettingMatContainer.innerHTML = '';
            const mainGrid = document.createElement('div');
            mainGrid.className = 'main-betting-grid';
            const zerosArea = document.createElement('div');
            zerosArea.className = 'zeros-area';
            const numbersAndColsContainer = document.createElement('div');
            numbersAndColsContainer.className = 'numbers-and-cols-container';
            const numbersArea = document.createElement('div');
            numbersArea.className = 'numbers-area';
            const colsArea = document.createElement('div');
            colsArea.className = 'cols-area';
            const outsideBetsContainer = document.createElement('div');
            outsideBetsContainer.className = 'outside-bets-container';

            zerosArea.appendChild(createBetArea('0', 'zero'));
            zerosArea.appendChild(createBetArea('00', 'zero'));

            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 12; col++) {
                    const num = 3 * col + (3 - row);
                    const numKey = num.toString();
                    const prop = numberProperties[numKey];
                    const el = createBetArea(numKey, `number ${prop.color}`);
                    numbersArea.appendChild(el);
                }
            }

            for (let i = 1; i <= 3; i++) {
                const el = createBetArea('2-1', 'col-bet');
                el.dataset.betType = `col${i}`;
                colsArea.appendChild(el);
            }

            const outsideBetsConfig = [
                { text: '1st 12', type: 'dozen1' }, { text: '2nd 12', type: 'dozen2' }, { text: '3rd 12', type: 'dozen3' },
                { text: '1-18', type: 'low' }, { text: 'EVEN', type: 'even' }, { text: 'RED', type: 'red', cls: 'red' },
                { text: 'BLACK', type: 'black', cls: 'black' }, { text: 'ODD', type: 'odd' }, { text: '19-36', type: 'high' }
            ];

            outsideBetsConfig.forEach(cfg => {
                const el = createBetArea(cfg.text, `outside-bet ${cfg.cls || ''}`);
                el.dataset.betType = cfg.type;
                outsideBetsContainer.appendChild(el);
            });

            numbersAndColsContainer.appendChild(numbersArea);
            numbersAndColsContainer.appendChild(colsArea);
            mainGrid.appendChild(zerosArea);
            mainGrid.appendChild(numbersAndColsContainer);
            bettingMatContainer.appendChild(mainGrid);
            bettingMatContainer.appendChild(outsideBetsContainer);
        }

        function createBetArea(text, className) {
            const el = document.createElement('div');
            el.className = `bet-area ${className}`;
            el.textContent = text;
            el.dataset.betType = text;
            el.addEventListener('click', () => placeBet(el.dataset.betType));
            return el;
        }

        function placeBet(betType) {
            if (isSpinning || currentBetAmount <= 0 || wallet < currentBetAmount) return;
            wallet -= currentBetAmount;
            bets[betType] = (bets[betType] || 0) + currentBetAmount;
            updateUI();
        }

        function updateUI() {
            walletAmountEl.textContent = wallet;
            let totalBet = Object.values(bets).reduce((a, b) => a + b, 0);
            totalBetAmountEl.textContent = totalBet;

            document.querySelectorAll('.chip').forEach(c => c.remove());
            for(const betType in bets) {
                const area = bettingMatContainer.querySelector(`[data-bet-type="${betType}"]`);
                if (area) {
                    let chip = area.querySelector('.chip');
                    if (!chip) {
                        chip = document.createElement('span');
                        chip.className = 'chip';
                        area.appendChild(chip);
                    }
                    chip.textContent = bets[betType];
                }
            }
        }

        function updateActiveBetButton(selectedBet) {
             betButtons.forEach(btn => {
                btn.classList.remove('active');
                if(btn.dataset.bet === 'max' && selectedBet === wallet) {
                    btn.classList.add('active');
                } else if (parseInt(btn.dataset.bet) === selectedBet) {
                    btn.classList.add('active');
                }
            });
        }

        function showStatusMessage(message, duration = 1000) {
            statusMessageEl.innerHTML = message;
            statusMessageEl.style.display = 'block';
            setTimeout(() => {
                statusMessageEl.style.display = 'none';
            }, duration);
        }

        function clearBets() {
            if (isSpinning) return;
            let returnedAmount = Object.values(bets).reduce((a, b) => a + b, 0);
            wallet += returnedAmount;
            bets = {};
            updateUI();
        }

        function handleSpin() {
            let totalBet = Object.values(bets).reduce((a, b) => a + b, 0);
            if (totalBet === 0) { showStatusMessage("Place a bet!"); return; }
            if (isSpinning) return;

            isSpinning = true;
            btnSpin.disabled = true;
            btnClear.disabled = true;

            let spinCount = 0;
            const spinInterval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * wheelNumbers.length);
                const randomNum = wheelNumbers[randomIndex];
                const prop = numberProperties[randomNum];
                winningNumberDisplay.textContent = randomNum;
                winningNumberDisplay.style.backgroundColor = prop.color === 'red' ? '#B71C1C' : prop.color === 'black' ? '#212121' : '#006847';
                spinCount++;
                if (spinCount > 20) {
                    clearInterval(spinInterval);
                    const winningIndex = Math.floor(Math.random() * wheelNumbers.length);
                    const winningNumber = wheelNumbers[winningIndex];
                    const finalProp = numberProperties[winningNumber];
                    winningNumberDisplay.textContent = winningNumber;
                    winningNumberDisplay.style.backgroundColor = finalProp.color === 'red' ? '#B71C1C' : finalProp.color === 'black' ? '#212121' : '#006847';

                    calculateWinnings(winningNumber);
                    isSpinning = false;
                    btnSpin.disabled = false;
                    btnClear.disabled = false;
                }
            }, 100);
        }

        function calculateWinnings(winningNumber) {
            let totalWinnings = 0;
            const prop = numberProperties[winningNumber];

            for(const betType in bets) {
                const betAmount = bets[betType];
                let win = false;
                let payoutRatio = 0;

                if (betType === winningNumber) { win = true; payoutRatio = 35; }
                else if (betType === 'red' && prop.color === 'red') { win = true; payoutRatio = 1; }
                else if (betType === 'black' && prop.color === 'black') { win = true; payoutRatio = 1; }
                else if (betType === 'even' && parseInt(winningNumber) % 2 === 0 && winningNumber !== '0' && winningNumber !== '00') { win = true; payoutRatio = 1; }
                else if (betType === 'odd' && parseInt(winningNumber) % 2 !== 0 && winningNumber !== '0' && winningNumber !== '00') { win = true; payoutRatio = 1; }
                else if (betType === 'low' && parseInt(winningNumber) >= 1 && parseInt(winningNumber) <= 18) { win = true; payoutRatio = 1; }
                else if (betType === 'high' && parseInt(winningNumber) >= 19 && parseInt(winningNumber) <= 36) { win = true; payoutRatio = 1; }
                else if (betType === 'dozen1' && prop.dozen === 1) { win = true; payoutRatio = 2; }
                else if (betType === 'dozen2' && prop.dozen === 2) { win = true; payoutRatio = 2; }
                else if (betType === 'dozen3' && prop.dozen === 3) { win = true; payoutRatio = 2; }
                else if (betType === 'col1' && prop.col === 1) { win = true; payoutRatio = 2; }
                else if (betType === 'col2' && prop.col === 2) { win = true; payoutRatio = 2; }
                else if (betType === 'col3' && prop.col === 3) { win = true; payoutRatio = 2; }

                if(win) {
                    const winnings = betAmount + (betAmount * payoutRatio);
                    totalWinnings += winnings;
                }
            }

            if (totalWinnings > 0) {
                wallet += totalWinnings;
                showStatusMessage(`WIN! +$${totalWinnings}`);
            } else {
                showStatusMessage('No win this round.');
            }
            bets = {};
            updateUI();
             if(wallet <= 0) showStatusMessage("Game Over!", 5000)
        }

        window.onload = () => {
            createBettingMat();
            walletAmountEl.textContent = wallet;
            updateActiveBetButton(currentBetAmount);

            betButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const betValue = button.dataset.bet;
                    currentBetAmount = (betValue === 'max') ? wallet : parseInt(betValue);
                    if (currentBetAmount > wallet) currentBetAmount = wallet;
                    updateActiveBetButton(currentBetAmount);
                });
            });

            btnSpin.addEventListener('click', handleSpin);
            btnClear.addEventListener('click', clearBets);
        };
    </script>


</body></html>
