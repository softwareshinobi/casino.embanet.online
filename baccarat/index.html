    <style>
        /* Custom styles adapted for the Quartz theme */
        :root {
            --quartz-primary: #593196;
            --quartz-secondary: #18b2b2;
            --quartz-dark: #343f56;
            --quartz-light: #f8f9fa;
            --tie-yellow: #ffc107;
            /* Define custom colors for bet buttons, consistent with Roulette/Slots */
            --custom-pink-button: #e91e63;
            --custom-pink-button-hover: #ff4081;
            --custom-pink-button-active: #ff4081;
        }

        html, body {
            height: 100%;
            margin: 0;
            overflow-y: auto; /* Allow vertical scrolling on all screen sizes */
            overflow-x: hidden; /* Prevent horizontal scrolling */
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Align items to the top to respect padding-top */
            padding: 0.5rem; /* Padding for small screens (sides) */
            background-color: var(--bs-body-bg);
            box-sizing: border-box; /* Include padding in element's total width and height */
        }

        .game-console {
            background: linear-gradient(to bottom, #212529, #343f56);
            border: 5px solid var(--quartz-secondary);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(24, 178, 178, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.5);
            padding: 1.5rem;
            width: 100%;
            max-width: 900px;
            position: relative;
            display: flex;
            flex-direction: column;
            z-index: 1; /* Ensure it's above the background if any */
            margin-top: 1rem;
            margin-bottom: 20px;
        }

        .playing-surface {
            background-color: var(--quartz-dark);
            border-radius: 15px;
            padding: 1rem;
            border: 3px solid #495057;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            display: flex;
            justify-content: space-around;
            align-items: flex-start; /* Default desktop alignment */
            min-height: 250px;
        }

        .hand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            width: 45%; /* Default desktop width */
        }

        .hand-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }

        .hand-area {
            min-height: 125px; /* Adjust height */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .hand-label {
            font-size: 1rem;
            color: var(--quartz-light);
            text-transform: uppercase;
        }

        .score-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--quartz-light);
            background-color: rgba(0,0,0,0.3);
            padding: 3px 10px;
            border-radius: 10px;
            border: 2px solid var(--quartz-secondary);
        }

        .card {
            width: 80px;
            height: 120px;
            background-color: white;
            border-radius: 8px;
            border: 1px solid #333;
            color: black;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 5px;
            box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .card .suit { font-size: 1.5rem; line-height: 1; }
        .card.red { color: #e95420; }
        .card.black { color: #212121; }
        .card-top { align-self: flex-start; }
        .card-bottom { align-self: flex-end; transform: rotate(180deg); }

        /* Action and Bet Panels - General Styling */
        .actions-panel, .betting-panel, .info-panel {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 15px;
        }
        .actions-panel{ border-top: 3px solid var(--quartz-secondary); }
        .betting-panel, .info-panel { border-top: 2px solid #212529; }

        /* Action and Bet Buttons - General Styling */
        .action-button, .bet-button {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.1s ease-in-out;
            padding: 0.75rem 0;
            width: 100%;
        }

        .bet-type-button {
            border: 3px solid transparent;
        }

        .bet-type-button.active {
            border-color: var(--tie-yellow);
            box-shadow: 0 0 10px var(--tie-yellow);
        }

        .action-button { font-size: 1.2rem; }
        .bet-button { font-size: 1rem; }

        /* --- Specific Bet Button Styles (from Roulette/Craps based on image) --- */
        .betting-panel .bet-button {
            background-color: var(--custom-pink-button);
            border: none;
            color: var(--quartz-light);
            box-shadow: none;
            border-radius: 0.375rem;
        }

        .betting-panel .bet-button:hover {
            background-color: var(--custom-pink-button-hover);
            border-color: var(--custom-pink-button-hover);
            box-shadow: 0 0 10px rgba(var(--bs-primary-rgb),.5);
        }

        .betting-panel .bet-button.active {
            background-color: var(--custom-pink-button-active);
            border: 2px solid var(--quartz-secondary);
            box-shadow: 0 0 15px rgba(24, 178, 178, 0.7);
            color: var(--quartz-light);
        }
        /* --- End Specific Bet Button Styles --- */

        /* --- Specific Info Panel Styles (from Roulette/Craps based on image) --- */
        .info-panel {
            background-color: var(--quartz-dark);
            border: 2px solid var(--quartz-secondary);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            padding: 1.2rem 1.5rem;
        }

        .info-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--quartz-light);
            text-align: center;
        }

        .info-display span {
            color: var(--quartz-secondary);
        }
        /* --- End Specific Info Panel Styles --- */

        .status-message {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.9);
            color: var(--quartz-secondary);
            font-size: 2rem;
            padding: 1.5rem;
            border-radius: 15px;
            border: 4px solid var(--quartz-secondary);
            z-index: 100;
            text-align: center;
            display: none;
            width: 90%;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .game-console { padding: 1rem; margin-top: 1rem; }
            .hand-area { min-height: 105px; gap: 5px; }
            .card { width: 60px; height: 90px; font-size: 1.5rem; }
            .card .suit { font-size: 1rem; }
            .action-button, .bet-type-button { font-size: 1rem; }
            .bet-button { font-size: 0.8rem; }
            .info-panel { padding: 0.75rem; }
            .info-display { font-size: 1rem; }

            /* --- Baccarat Specific Mobile Layout for Hands (Mimicking Blackjack) --- */
            .playing-surface {
                flex-direction: column; /* Stack hands vertically */
                align-items: center; /* Center stacked hands */
                padding: 0.5rem; /* Adjust padding for mobile playing surface */
                min-height: initial; /* Allow height to adjust */
            }
            .hand-container {
                width: 100%; /* Take full width to stack */
                margin-top: 0.5rem; /* Small margin between stacked hands */
                margin-bottom: 0.5rem;
            }
            .hand-container:first-child {
                margin-top: 0; /* Remove top margin for the first hand */
            }
            /* Cards should already scale down from previous mobile rules */
        }
    </style>
</head>
