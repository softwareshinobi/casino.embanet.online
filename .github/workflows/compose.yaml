name: Docker Compose Build and Push

on:
  push:
    branches:
      - '**'

jobs:
  docker_publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Securely Log in to Docker Hub (STILL REQUIRED)
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 2. Build the Image using the Modern Docker Compose CLI
    - name: Build Docker Image via Compose
      run: |
        # Use the modern command to build the image defined in compose.yaml
        docker compose build

    # 3. Push the Image to Docker Hub using Docker Compose Push
    - name: Push Image to Docker Hub
      run: |
        # Use the modern command. This automatically pushes the image
        # (softwareshinobi/portal.intranet.valorantdigital.com:latest)
        # defined in your compose.yaml file.
        docker compose push
